spring:
  application:
    name: moment-weaver-app

  datasource:
    # LOCAL ONLY: 默认连接本地 admin/1234
    # 生产/部署时必须用环境变量覆盖
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DB:moment_weaver}?useUnicode=true&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:1234}
    driver-class-name: com.mysql.cj.jdbc.Driver

  data:
    mongodb:
      uri: ${MONGO_URI:mongodb://localhost:27017/moment_weaver}
      database: moment_weaver
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

server:
  port: 8080

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
      id-type: ASSIGN_ID

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html

knife4j:
  enable: true
  setting:
    language: zh_cn

# 项目自有配置
moment:
  jwt:
    # 32 字节 base64 编码的 HMAC-SHA 密钥；生产请用环境变量覆盖
    secret: ${MOMENT_JWT_SECRET:bW9tZW50LXdlYXZlci1kZWZhdWx0LXNlY3JldC1rZXktMzItYnl0ZXMh}
    access-ttl-seconds: 7200
    refresh-ttl-seconds: 1209600
    issuer: moment-weaver
  ai:
    # FastAI 服务（M2 启用）
    base-url: ${MOMENT_AI_BASE_URL:http://localhost:8000}
    connect-timeout-ms: 5000
    read-timeout-ms: 120000
  consent:
    # 同意书版本号，跟随前端 consent.md 一起发版
    current-version: "v1.0-20250612"
  authz:
    # 授权 token 有效期（天）
    default-ttl-days: 7

# 阿里云 OSS（M3 启用）
aliyun:
  oss:
    sts:
      enabled: false
    bucket: ${ALIYUN_OSS_BUCKET:moment-weaver-dev}
    region: ${ALIYUN_OSS_REGION:oss-cn-hangzhou}

logging:
  level:
    root: INFO
    com.momentweaver: DEBUG
    org.springframework.security: INFO
    org.springframework.web: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
