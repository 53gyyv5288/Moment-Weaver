spring:
  application:
    name: moment-weaver-app

  datasource:
    # LOCAL ONLY: 默认连接本地 admin/1234
    # 生产/部署时必须用环境变量覆盖
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DB:moment_weaver}?useUnicode=true&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:1234}
    driver-class-name: com.mysql.cj.jdbc.Driver

  data:
    mongodb:
      uri: ${MONGO_URI:mongodb://localhost:27017/moment_weaver}
      database: moment_weaver
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null
    # 注意：这里**不能**设 property-naming-strategy: SNAKE_CASE。
    # 那会把所有对前端的响应字段也改成下划线（accessToken → access_token），
    # 导致前端读不到 token 而全线 401。
    # 与 FastAPI (Python) 的字段命名对齐只需要 RAG 的几个 DTO，
    # 已在各 DTO 上用 @JsonNaming(SnakeCaseStrategy) 单独标注。
    # LocalDateTime / LocalDate 序列化为 ISO-8601 字符串（默认是 [yyyy,mm,dd,...] 数组，
    # Pydantic / FastAPI 会 422）
    serialization:
      write-dates-as-timestamps: false

  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

server:
  port: 8080

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
      id-type: ASSIGN_ID

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html

knife4j:
  enable: true
  setting:
    language: zh_cn

# 项目自有配置
moment:
  jwt:
    # 32 字节 base64 编码的 HMAC-SHA 密钥；生产请用环境变量覆盖
    secret: ${MOMENT_JWT_SECRET:bW9tZW50LXdlYXZlci1kZWZhdWx0LXNlY3JldC1rZXktMzItYnl0ZXMh}
    access-ttl-seconds: 7200
    refresh-ttl-seconds: 1209600
    issuer: moment-weaver
  ai:
    # FastAI 服务（M2 启用）
    base-url: ${MOMENT_AI_BASE_URL:http://localhost:8000}
    connect-timeout-ms: 5000
    # M4 family-template-v1 家族成稿 + MiniMax-M3 推理；
    # AI service 内部 llm_timeout_s=600s，这里留 2x 余量 = 1200s
    read-timeout-ms: 1200000
  consent:
    # 同意书版本号，跟随前端 consent.md 一起发版
    current-version: "v1.0-20250612"
  authz:
    # 授权 token 有效期（天）
    default-ttl-days: 7
  share:
    # M5-A: 分享链接默认配置
    default-expires-days: 30         # 默认 30 天
    min-expires-days: 1              # 最少 1 天
    max-expires-days: 90             # 最多 90 天
    rate-limit-per-min: 30           # 同 token+ip 每分钟 30 次
    # 公开端 base URL（生成 shareUrl 用；前端域名）
    public-base-url: ${MOMENT_PUBLIC_BASE_URL:http://localhost:5173}
  export:
    pdf:
      # M5-A.3: PDF 导出配置
      # 字体绝对路径（思源黑体子集；用环境变量指定，git 不入库）
      font-path: ${MOMENT_PDF_FONT_PATH:C:/Learning/Moment Weaver/font/SourceHanSansSC-VF.ttf}
      font-family: SourceHanSansSC
      font-size: 11.0
      heading-font-size: 16.0
      cache-ttl-seconds: 3600
      oss-key-prefix: pdfs/
  security:
    # 内部服务共享密钥：AI 服务 (FastAPI) 调 Spring 端 /api/v1/memory/subjects/*/authorizations/check
    # 时通过 X-Internal-Secret 头传；不匹配则 401。
    # 生产必须用环境变量覆盖（dev 默认值仅本地开发用）。
    internal-secret: ${MOMENT_INTERNAL_SECRET:moment-internal-dev-secret-change-me}
  memory:
    # 短期记忆（STM）：Redis 滚动摘要 + 最近 K 轮 verbatim
    # 与 RAG（Milvus 长期记忆）协同：Mongo 权威、Redis 短期、Milvus 跨 session
    stm:
      enabled: true
      recent-turns-keep: 6          # K 生产为20
      compress-turn-threshold: 5     # 轮数触发 生产20
      compress-token-threshold: 2000 # token 触发（粗估 len*0.7） 生产12000
      summary-max-output-tokens: 600 # 摘要 LLM 输出 cap   生产600
      redis-ttl-minutes: 60         # 滑动 TTL   生产为120
      # M8+ 新增：空 summary 防御 / 二次压缩触发
      max-consecutive-empty-summary: 3    # 连续空 N 次跳过   生产3
      summary-hard-limit-chars: 1500      # summary 字符硬限（超则触发 condense） 生产1500
      condense-max-output-tokens: 600     # condense LLM 输出 cap（Java 端摘要 cap 略小） 生产600
      compress-lock-timeout-ms: 0         # 同 sid 并发锁等待（0=不等待，下轮再试）
      # Step 3：Redis 分布式压缩锁 TTL（秒）。压缩 task 超时会自动释放（兜底防死锁）。
      # 默认 60s：滚动摘要 LLM 5-20s + 二次压缩 3-10s，留 3x 余量。
      compress-lock-ttl-seconds: 60
    # M9+ Adaptive RAG (Phase 1)：让 LLM 判定「是否需要 RAG」。
    # 默认开启；关闭时 InterviewService 每次都直接调 RAG（改造前行为）。
    adaptive-rag:
      enabled: true        # 默认开；如发现 LLM 决策抖动，改 false 走原貌
      decider-timeout-ms: 3000  # LLM 决策调用 1-3s 是常态，3000ms 覆盖 95% 调用；
                                # 偶尔超时走 DEFAULT_RETRIEVE（不影响主路径，只是降级到「总是 retrieve」）
      min-confidence: 0.7      # 决策置信度阈值，仅日志记录
# 阿里云 OSS（M3 启用）
aliyun:
  oss:
    sts:
      # mock | real。real 必须配套 aliyun.ram.* 配置
      mode: real
      # mock 模式下 token 有效期（秒），仅展示
      mock-ttl-seconds: 3600
    # 旧字段，保留兼容（real 模式下仍要求 sts.enabled=true）
    sts-enabled: false
    role-session-name: moment-weaver-web
    bucket: ${ALIYUN_OSS_BUCKET}
    region: ${ALIYUN_OSS_REGION}
  ram:
    # real 模式必填；mock 模式忽略
    access-key-id: ${ALIYUN_RAM_AK:}
    access-key-secret: ${ALIYUN_RAM_SK:}
    role-arn: ${ALIYUN_RAM_ROLE_ARN:}
    # OSS 授权策略；留空走 RAM 角色默认权限
    policy: ${ALIYUN_RAM_POLICY:}
    duration-seconds: 3600
  # 素材本地存储（M3 mock 模式用）
  local-storage:
    root: ${MOMENT_LOCAL_STORAGE_ROOT:./uploads}

logging:
  level:
    root: INFO
    com.momentweaver: DEBUG
    com.aliyun.oss: INFO
    com.aliyuncs: INFO
    org.springframework: INFO
    org.springframework.security: INFO
    org.springframework.web: INFO
    org.hibernate.SQL: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
